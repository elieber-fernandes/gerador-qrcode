<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
        }

        h1 { color: #333; font-size: 24px; margin-bottom: 20px; }

        .input-group { margin-bottom: 15px; text-align: left; }
        label { font-size: 14px; color: #666; display: block; margin-bottom: 5px; font-weight: 500; }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #007bff;
        }

        .colors { display: flex; gap: 15px; margin-bottom: 20px; }
        .color-box { flex: 1; text-align: left; }
        input[type="color"] { 
            width: 100%; 
            height: 40px; 
            border: none; 
            cursor: pointer; 
            padding: 0;
            border-radius: 5px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            box-sizing: border-box;
            text-align: center;
        }

        .btn-primary { background-color: #007bff; }
        .btn-primary:hover { background-color: #0056b3; }

        .btn-success { background-color: #28a745; margin-top: 15px; }
        .btn-success:hover { background-color: #218838; }

        #qrcode {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            padding: 10px;
            background: #fff;
            border-radius: 5px;
        }

        #link-download { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gerador de QR Code</h1>

        <div class="input-group">
            <label for="texto">Digite o Link ou Texto:</label>
            <input type="text" id="texto" placeholder="Ex: https://google.com" autocomplete="off" />
        </div>

        <div class="colors">
            <div class="color-box">
                <label for="corEscura">Cor do Código:</label>
                <input type="color" id="corEscura" value="#000000">
            </div>
            <div class="color-box">
                <label for="corClara">Cor de Fundo:</label>
                <input type="color" id="corClara" value="#ffffff">
            </div>
        </div>

        <button id="btn-gerar" class="btn btn-primary">Gerar QR Code</button>

        <div id="qrcode"></div>

        <a id="link-download" class="btn btn-success" download="qrcode.png">Baixar Imagem</a>
    </div>

    <script type="text/javascript">
        const qrcodeContainer = document.getElementById("qrcode");
        const linkDownload = document.getElementById("link-download");
        const btnGerar = document.getElementById("btn-gerar");
        const inputTexto = document.getElementById("texto");

        btnGerar.addEventListener("click", gerarQR);

        inputTexto.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                gerarQR();
            }
        });

        function gerarQR() {
            const textoValue = inputTexto.value.trim();
            const corEscura = document.getElementById("corEscura").value;
            const corClara = document.getElementById("corClara").value;

            if (!textoValue) {
                alert("Por favor, digite um texto ou link válido!");
                inputTexto.focus();
                return;
            }

            // Limpa o QR Code anterior e esconde o botão de download
            qrcodeContainer.innerHTML = "";
            linkDownload.style.display = "none";

            // Cria o novo QR Code
            new QRCode(qrcodeContainer, {
                text: textoValue,
                width: 200,
                height: 200,
                colorDark : corEscura,
                colorLight : corClara,
                correctLevel : QRCode.CorrectLevel.H
            });

            // Prepara o download após um breve tempo para garantir a renderização
            setTimeout(prepararDownload, 100);
        }

        function prepararDownload() {
            const imagem = qrcodeContainer.querySelector("img");

            if (imagem && imagem.src) {
                linkDownload.href = imagem.src;
                linkDownload.style.display = "block";
            } else {
                const canvas = qrcodeContainer.querySelector("canvas");
                if (canvas) {
                    linkDownload.href = canvas.toDataURL("image/png");
                    linkDownload.style.display = "block";
                }
            }
        }
    </script>

</body>
</html>
