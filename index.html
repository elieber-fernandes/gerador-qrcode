<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR Code com Logo</title>
    <script src="https://cdn.jsdelivr.net/npm/qr-creator/dist/qr-creator.min.js"></script>

    <style>
        /* CSS Mantido e Aprimorado do exemplo anterior */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 380px; /* Um pouco mais largo para acomodar o canvas */
            box-sizing: border-box;
        }

        h1 { color: #333; font-size: 24px; margin-bottom: 20px; }

        .input-group { margin-bottom: 15px; text-align: left; }
        label { font-size: 14px; color: #666; display: block; margin-bottom: 5px; font-weight: 500; }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #007bff;
        }

        .colors { display: flex; gap: 15px; margin-bottom: 20px; }
        .color-box { flex: 1; text-align: left; }
        input[type="color"] { 
            width: 100%; 
            height: 40px; 
            border: none; 
            cursor: pointer; 
            padding: 0;
            border-radius: 5px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            box-sizing: border-box;
            text-align: center;
        }

        .btn-primary { background-color: #007bff; }
        .btn-primary:hover { background-color: #0056b3; }

        .btn-success { background-color: #28a745; margin-top: 15px; }
        .btn-success:hover { background-color: #218838; }

        /* O container do QR Code agora exibe o Canvas diretamente */
        #qrcode-canvas {
            margin-top: 25px;
            display: none; /* Escondido inicialmente */
            justify-content: center;
            padding: 10px;
            background: #fff;
            border-radius: 5px;
            /* Garante que o canvas não extrapole o container */
            max-width: 100%; 
            height: auto;
        }

        #link-download { display: none; }

    </style>
</head>
<body>

    <div class="container">
        <h1>QR Code com Logo</h1>

        <div class="input-group">
            <label for="texto">Digite o Link ou Texto:</label>
            <input type="text" id="texto" placeholder="Ex: https://google.com" autocomplete="off" />
        </div>

        <div class="colors">
            <div class="color-box">
                <label for="corEscura">Cor do Código:</label>
                <input type="color" id="corEscura" value="#000000">
            </div>
            <div class="color-box">
                <label for="corClara">Cor de Fundo:</label>
                <input type="color" id="corClara" value="#ffffff">
            </div>
        </div>

        <button id="btn-gerar" class="btn btn-primary">Gerar QR Code</button>

        <div style="display: flex; justify-content: center;">
            <canvas id="qrcode-canvas"></canvas>
        </div>

        <a id="link-download" class="btn btn-success" download="qrcode-com-logo.png">Baixar Imagem</a>
    </div>

    <script type="text/javascript">
        const canvas = document.getElementById("qrcode-canvas");
        const linkDownload = document.getElementById("link-download");
        const btnGerar = document.getElementById("btn-gerar");
        const inputTexto = document.getElementById("texto");

        // --- CONFIGURAÇÃO DA LOGO ---
        // SUBSTITUA ESTE URL PELA SUA LOGO (Pode ser um caminho local ou URL)
        // DICA: Use uma imagem quadrada e com fundo transparente (PNG)
        const URL_DA_LOGO = 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/120px-Instagram_icon.png';
        const TAMANHO_QR = 300; // Tamanho final do QR Code (px)
        const PERCENTUAL_LOGO = 0.20; // A logo ocupará 20% do tamanho do QR

        btnGerar.addEventListener("click", gerarQRComLogo);

        inputTexto.addEventListener("keypress", (e) => {
            if (e.key === "Enter") gerarQRComLogo();
        });

        async function gerarQRComLogo() {
            const textoValue = inputTexto.value.trim();
            const corEscura = document.getElementById("corEscura").value;
            const corClara = document.getElementById("corClara").value;

            if (!textoValue) {
                alert("Por favor, digite um texto ou link válido!");
                inputTexto.focus();
                return;
            }

            // 1. Limpa o canvas e esconde o download
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            linkDownload.style.display = "none";
            canvas.style.display = "none";

            // 2. Gera o QR Code básico no Canvas
            QrCreator.render({
                text: textoValue,
                radius: 0, // 0 para blocos quadrados, 0.5 para arredondados
                ecLevel: 'H', // Nível de Correção H (Alto) é essencial para logos
                fill: corEscura,
                background: corClara,
                size: TAMANHO_QR
            }, canvas);

            // 3. Sobrepõe a Logo (Processo Assíncrono)
            try {
                await desenharLogoNoCentro(canvas, URL_DA_LOGO);
                
                // 4. Finaliza: Mostra o resultado e prepara o download
                canvas.style.display = "block";
                linkDownload.href = canvas.toDataURL("image/png");
                linkDownload.style.display = "block";
            } catch (error) {
                console.error("Erro ao carregar a logo:", error);
                alert("O QR Code foi gerado, mas não foi possível carregar a logo central.");
                // Mesmo sem logo, mostra o QR básico
                canvas.style.display = "block";
                linkDownload.href = canvas.toDataURL("image/png");
                linkDownload.style.display = "block";
            }
        }

        // Função que desenha a logo no centro do canvas já existente
        function desenharLogoNoCentro(canvas, logoUrl) {
            return new Promise((resolve, reject) => {
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.crossOrigin = "Anonymous"; // Evita erros de CORS se a imagem for externa
                img.src = logoUrl;

                img.onload = () => {
                    // Calcula tamanho e posição da logo
                    const logoSize = TAMANHO_QR * PERCENTUAL_LOGO;
                    const x = (TAMANHO_QR - logoSize) / 2;
                    const y = (TAMANHO_QR - logoSize) / 2;

                    // --- MELHORIA DE LEITURA ---
                    // Desenha um círculo/quadrado branco atrás da logo para garantir contraste
                    ctx.fillStyle = document.getElementById("corClara").value; // Usa a cor de fundo escolhida
                    ctx.beginPath();
                    // Desenha um círculo um pouco maior que a logo
                    ctx.arc(TAMANHO_QR / 2, TAMANHO_QR / 2, (logoSize / 2) * 1.1, 0, Math.PI * 2);
                    ctx.fill();

                    // Desenha a logo
                    ctx.drawImage(img, x, y, logoSize, logoSize);
                    resolve();
                };

                img.onerror = () => {
                    reject(new Error("Falha ao carregar imagem da logo."));
                };
            });
        }
    </script>

</body>
</html>
